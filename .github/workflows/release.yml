# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.28"

      - name: Install git-changelog
        run: uv tool install git-changelog

      - name: Prepare release notes
        run: git-changelog --release-notes > release-notes.md

      - name: Setup typst
        uses: typst-community/setup-typst@40d32bb6ccb235bd7f5164cb47cfd40a5ea3a314 # v5.2.0
        with:
          typst-version: "0.13"

      - name: Build manual
        env:
          TYPST_ROOT: ${{ github.workspace }}
        run: typst compile docs/docs.typ docs/docs.pdf

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --title "rubber-article - ${{ github.ref_name }}" \
            --notes-file release-notes.md \
            --fail-on-no-commits \
            --draft \
            docs/docs.pdf#tuwien-geo-masterthesis-manual.pdf
